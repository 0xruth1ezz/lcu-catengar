name: Windows build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      RUST_MIN_STACK: '268435456'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test release tooling
        run: |
          python -B -m unittest discover -s scripts -p test_release.py -v
          if ($LASTEXITCODE) { throw 'Release tooling tests failed' }
      - uses: ./.github/actions/windows-ci
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: catengar-windows-x64-${{ github.sha }}
          path: |
            target/x86_64-pc-windows-msvc/release/catengar.exe
            target/x86_64-pc-windows-msvc/release/catengar-auth.exe
            target/x86_64-pc-windows-msvc/release/catengar-diagnose.exe
            target/x86_64-pc-windows-msvc/release/WebView2Loader.dll
            target/x86_64-pc-windows-msvc/release/WebView2-LICENSE.txt
            README.md
          if-no-files-found: error
          retention-days: 14
